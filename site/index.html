<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Native controls, scrollbars and dropdowns follow the OS theme. -->
		<meta name="color-scheme" content="light dark" />
		<title>arborium-rt playground</title>
		<link rel="icon" href="data:," />
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body
		class="bg-zinc-50 px-5 pt-4 pb-10 text-sm text-zinc-900 dark:bg-zinc-950 dark:text-zinc-200"
	>
		<header class="mb-3 flex items-baseline gap-4">
			<h1 class="text-lg font-bold">arborium-rt playground</h1>
			<span
				id="status"
				class="text-zinc-500 data-error:text-red-600 dark:text-zinc-400 dark:data-error:text-red-400"
				>Loading runtime…</span
			>
		</header>

		<form
			id="controls"
			class="mb-3 flex flex-wrap items-center gap-x-4 gap-y-2 text-zinc-500 dark:text-zinc-400"
		>
			<label class="flex items-center gap-1.5">
				Language
				<select
					id="language"
					disabled
					class="rounded border border-zinc-300 bg-white px-1.5 py-0.5 text-zinc-900 disabled:opacity-50 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200"
				></select>
			</label>
			<button
				type="button"
				id="sample"
				class="cursor-pointer rounded border border-zinc-300 bg-white px-1.5 py-0.5 text-zinc-900 hover:border-blue-500 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200"
			>
				Load sample
			</button>
			<label class="flex items-center gap-1.5">
				Output
				<select
					id="output"
					class="rounded border border-zinc-300 bg-white px-1.5 py-0.5 text-zinc-900 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200"
				>
					<option value="spans">Spans (rendered here)</option>
					<option value="custom-elements">HTML: custom elements</option>
					<option value="class-names">HTML: class names</option>
				</select>
			</label>
			<label class="flex items-center gap-1.5">
				Injection depth
				<input
					id="depth"
					type="number"
					min="0"
					max="32"
					value="3"
					class="w-16 rounded border border-zinc-300 bg-white px-1.5 py-0.5 text-zinc-900 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200"
				/>
			</label>
			<label class="flex items-center gap-1.5">
				<input id="autoload" type="checkbox" checked class="accent-blue-500" />
				Load injected grammars
			</label>
			<button
				type="button"
				id="share"
				class="cursor-pointer rounded border border-zinc-300 bg-white px-1.5 py-0.5 text-zinc-900 hover:border-blue-500 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200"
			>
				Copy link
			</button>
		</form>

		<main class="grid grid-cols-1 gap-3 lg:grid-cols-2">
			<section class="flex min-w-0 flex-col">
				<h2
					class="mb-1.5 text-xs font-semibold tracking-wide text-zinc-500 uppercase dark:text-zinc-400"
				>
					Source
				</h2>
				<textarea
					id="source"
					spellcheck="false"
					autocapitalize="off"
					autocomplete="off"
					class="h-144 resize-y overflow-auto rounded border border-zinc-300 bg-white px-3 py-2.5 font-mono text-sm/normal whitespace-pre text-zinc-900 focus:border-blue-500 focus:outline-none dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200"
				></textarea>
			</section>
			<section class="flex min-w-0 flex-col">
				<h2
					class="mb-1.5 text-xs font-semibold tracking-wide text-zinc-500 uppercase dark:text-zinc-400"
				>
					Highlighted
					<span class="font-normal tracking-normal normal-case"
						>(hover a token to see its tag)</span
					>
				</h2>
				<pre
					id="result"
					class="h-144 overflow-auto rounded border border-zinc-300 bg-white px-3 py-2.5 font-mono text-sm/normal whitespace-pre text-zinc-900 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200"
				></pre>
			</section>
		</main>

		<dl id="stats" class="my-2.5 flex flex-wrap gap-x-5 gap-y-1 font-mono text-xs"></dl>

		<details class="mt-2">
			<summary class="mb-1.5 cursor-pointer text-zinc-500 dark:text-zinc-400">
				Tag legend
			</summary>
			<div
				id="legend"
				class="grid grid-cols-2 gap-x-3 gap-y-0.5 font-mono text-xs sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6"
			></div>
		</details>
		<details class="mt-2">
			<summary class="mb-1.5 cursor-pointer text-zinc-500 dark:text-zinc-400">
				Raw output
			</summary>
			<pre
				id="raw"
				class="max-h-96 overflow-auto rounded border border-zinc-300 bg-white px-3 py-2.5 font-mono text-sm/normal break-all whitespace-pre-wrap text-zinc-900 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200"
			></pre>
		</details>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
